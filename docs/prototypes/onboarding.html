<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>芽豆初次引导</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
/* 布局：左边一部纸面手机跑引导，右边是控制台和触感轨道；窄屏时控制台落到手机下方。 */
:root {
  --desk: #E4E0D6;          /* 手机外的桌面 */
  --paper: #F2EFE7;         /* PaperBackground */
  --ink: #17181A;           /* AccentColor / 主文字 */
  --on-accent: #FFFFFF;     /* OnAccent */
  --red: #D5452B;           /* LedgerRed */
  --pencil: rgba(23, 24, 26, 0.42);
  --rule: rgba(23, 24, 26, 0.16);
  --card: #FBFAF6;
  --panel: #EDE9E0;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --S: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #1B1C1E; --paper: #101112; --ink: #F2EFE7; --on-accent: #17181A; --red: #F0674C;
    --pencil: rgba(242, 239, 231, 0.42); --rule: rgba(242, 239, 231, 0.16); --card: #18191B; --panel: #222326;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #1B1C1E; --paper: #101112; --ink: #F2EFE7; --on-accent: #17181A; --red: #F0674C;
  --pencil: rgba(242, 239, 231, 0.42); --rule: rgba(242, 239, 231, 0.16); --card: #18191B; --panel: #222326;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--desk); color: var(--ink); font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  margin: 0;
  box-sizing: border-box;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.wrap { display: flex; gap: 32px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }

/* ---------- 手机 ---------- */
.phone {
  position: relative; overflow: hidden; flex: none;
  width: min(390px, 100%);
  height: min(812px, max(660px, calc(100dvh - 48px)));
  border-radius: 46px; background: var(--paper);
  box-shadow: 0 0 0 10px var(--ink), 0 30px 60px rgba(0,0,0,.18);
  margin: 10px;
}
.home, .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; }
.sheet { background: var(--paper); z-index: 2; transform-origin: 85% 0; }
.top { padding: 56px 22px 0; display: flex; align-items: center; gap: 14px; }
.top svg { flex: 1; height: 14px; overflow: visible; }
.top path { fill: none; stroke-linecap: round; }
.skip { background: none; border: 0; color: var(--pencil); font-size: 14px; padding: 6px 2px; cursor: pointer; }
.history { list-style: none; margin: 14px 26px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-height: 22px; }
.history li { transition: color calc(500ms * var(--S)), font-size calc(400ms * var(--S)); color: var(--pencil); font-size: 13px; }
.history:not(.summary) li:nth-last-child(n+4) { display: none; }
.history button { all: unset; cursor: pointer; display: block; padding: 2px 0; border-bottom: 1px dashed transparent; }
.history button:hover, .history button:focus-visible { border-bottom-color: var(--pencil); }
.history.summary li { color: var(--ink); font-size: 15px; font-family: var(--serif); }
.history.summary li::before { content: "·"; color: var(--red); margin-right: 8px; font-weight: 700; }
.stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 26px; }
.foot { min-height: 128px; padding: 0 22px 40px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.foot .row { display: flex; gap: 10px; }
.foot .row .btn { flex: 1; }

.headline { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.4; margin: 0; text-wrap: balance; min-height: 1.4em; }
.desc { font-size: 15px; line-height: 1.65; color: var(--pencil); margin: 0; }
.note { font-size: 12.5px; color: var(--pencil); margin: 0; }
.g { display: inline-block; white-space: pre; }
.em { color: var(--red); }
.center { text-align: center; align-items: center; }

.btn {
  height: 52px; border-radius: 26px; border: 0; cursor: pointer; font-size: 16px; font-weight: 600;
  background: var(--ink); color: var(--on-accent); position: relative; overflow: hidden;
  transition: transform calc(120ms * var(--S)) ease;
}
.btn:active { transform: scale(.97); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.text { background: transparent; color: var(--pencil); height: 40px; font-weight: 500; }
.btn .fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--red) 30%, transparent); transform-origin: left; transform: scaleX(0); }
.btn .lbl { position: relative; }
.btn[hidden] { display: none !important; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  text-align: left; background: var(--card); border: 0; border-radius: 16px; padding: 14px 16px; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--rule); display: grid; gap: 2px; transition: box-shadow calc(160ms * var(--S));
}
.opt b { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.opt span { font-size: 13px; color: var(--pencil); }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 1.6px var(--ink); }

/* ---------- 豆子：x、y、缩放分层，才能画出抛物线 ---------- */
.bx, .by, .bs { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.bx { z-index: 5; pointer-events: none; }
.core { position: absolute; width: 26px; height: 26px; left: -13px; top: -13px; border-radius: 50%; background: var(--red); }

/* ---------- 插画 ---------- */
svg.ink path, svg.ink line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
svg.ink .pencil { stroke: var(--pencil); }
svg.ink .redline { stroke: var(--red); }
.brand-tick { width: 64px; height: 40px; }
.brand-tick path { stroke: var(--red) !important; stroke-width: 70; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 34px; letter-spacing: .08em; margin: 0; }
.ground { width: 200px; height: 14px; }

.phone-art { width: 170px; height: 150px; margin: 0 auto; }

.link { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-family: var(--serif); font-size: 17px; }
.link svg { width: 100%; height: 20px; overflow: visible; }
.avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; box-shadow: inset 0 0 0 1.6px var(--ink); background: var(--card); }

.big { font-family: var(--serif); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; justify-content: center; }
.big small { font-size: 16px; color: var(--pencil); font-family: var(--sans); }
.ruler { width: 100%; height: 64px; touch-action: none; cursor: ew-resize; overflow: visible; }
.ruler text { font-size: 11px; fill: var(--pencil); text-anchor: middle; font-family: var(--sans); }
.ruler .knob { fill: var(--red); transition: transform calc(220ms * var(--S)) cubic-bezier(.3, 1.5, .5, 1); }

.dots { display: grid; grid-template-columns: repeat(21, 12px); grid-auto-rows: 12px; justify-content: center; }
.dot { width: 6px; height: 6px; margin: 3px; border-radius: 50%; background: var(--rule); transition: transform calc(180ms * var(--S)) cubic-bezier(.3, 1.8, .5, 1), background calc(120ms * var(--S)); }
.dot.on { background: var(--ink); transform: scale(1.15); }
.dot.last.on { background: var(--red); transform: scale(1.5); }
.num { font-variant-numeric: tabular-nums; }

.say { align-self: center; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-radius: 26px; border: 0; cursor: pointer; background: var(--card); box-shadow: inset 0 0 0 1.4px var(--ink); font-family: var(--serif); font-size: 17px; }
.say svg { width: 18px; height: 18px; }
.wave { display: inline-flex; align-items: center; gap: 3px; height: 22px; }
.wave i { display: block; width: 3px; border-radius: 2px; background: var(--red); height: 6px; }
.ledger { display: grid; grid-template-columns: auto 1fr auto 22px; align-items: center; gap: 10px; padding: 10px 2px 8px; border-bottom: 1px solid var(--rule); min-height: 30px; }
.slot { opacity: 0; }
.slot.cat { font-family: var(--serif); font-size: 17px; }
.slot.acct { font-size: 13px; color: var(--pencil); }
.slot.amt { font-family: var(--serif); font-size: 18px; font-variant-numeric: tabular-nums; }
.tag { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--ink); font-size: 14px; white-space: nowrap; z-index: 3; }
.ledger svg { width: 22px; height: 16px; }
.ledger svg path { stroke: var(--red) !important; stroke-width: 70; }

.tabs { display: flex; gap: 4px; padding: 8px; border-radius: 30px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); }
.tab { flex: 1; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--pencil); padding: 4px 0; border-radius: 22px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.first { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 38px; padding: 0 16px; border-radius: 19px; border: 0; cursor: pointer; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-accent); box-shadow: none; }
.table { min-height: 132px; display: flex; flex-wrap: wrap; gap: 14px 12px; align-content: center; justify-content: center; padding: 8px 0; }
.acard { position: relative; width: 92px; height: 58px; border-radius: 9px; background: var(--card); box-shadow: inset 0 0 0 1.4px var(--ink); padding: 8px 10px; box-sizing: border-box; font-family: var(--serif); font-size: 14px; }
.acard::after { content: ""; position: absolute; left: 10px; right: 30px; bottom: 11px; height: 2px; border-radius: 1px; background: var(--rule); }
.acard .tape { position: absolute; width: 34px; height: 13px; top: -7px; left: 28px; background: color-mix(in srgb, var(--red) 22%, transparent); transform: rotate(-6deg); }

.sprout { width: min(210px, 30vh); aspect-ratio: 1; margin: 0 auto; overflow: visible; }
.sprout path { stroke-width: 4.8; }
.sprout .leaf { transform-box: view-box; }

.benefits { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.benefits li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.benefits li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; transform: translateY(-2px); }


.say { height: auto; min-height: 52px; padding: 12px 18px; border-radius: 22px; text-align: left; line-height: 1.5; }
.say svg { flex: none; }
.seg { transition: color calc(200ms * var(--S)); background-image: linear-gradient(var(--red), var(--red)); background-repeat: no-repeat; background-position: 0 100%; background-size: 0 1.5px; }
.seg.on { color: var(--red); background-size: 100% 1.5px; transition: background-size calc(260ms * var(--S)) ease-out, color calc(200ms * var(--S)); }
.book { display: grid; }
.book-h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--serif); font-size: 16px; padding-bottom: 6px; border-bottom: 1.3px solid color-mix(in srgb, var(--ink) 60%, transparent); }
.book-h span:last-child { font-family: var(--sans); font-size: 12px; color: var(--pencil); }
.entry { position: relative; display: grid; grid-template-columns: auto 1fr auto 18px; gap: 10px; align-items: baseline; padding-block: 10px; border-bottom: 1px solid var(--rule); overflow: hidden; }
.entry .c { font-family: var(--serif); font-size: 16px; }
.entry .a { font-size: 12.5px; color: var(--pencil); }
.entry .m { font-family: var(--serif); font-size: 16px; font-variant-numeric: tabular-nums; }
.entry svg { width: 18px; height: 12px; align-self: center; }
.entry svg path { stroke: var(--red) !important; stroke-width: 70; }
.entry.fresh { animation: fresh calc(1600ms * var(--S)) ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--red) 14%, transparent); } to { background: transparent; } }
.strike { position: absolute; left: 0; right: 18px; top: 50%; height: 1.6px; background: var(--red); transform: scaleX(0); transform-origin: left; }
.result { margin: 0; text-align: center; font-family: var(--serif); font-size: 16px; min-height: 1.5em; }
.answer { display: grid; gap: 12px; }
.ans { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.5; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center; font-size: 14px; }
.bars .num { font-variant-numeric: tabular-nums; color: var(--pencil); text-align: right; }
.bar { display: block; height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 70%, transparent); transform-origin: left; }
.bar.hot { background: var(--red); }


.beats { display: flex; gap: 6px; }
.beats button { all: unset; cursor: pointer; flex: 1; display: grid; gap: 6px; font-size: 12.5px; color: var(--pencil); text-align: center; }
.beats button i { display: block; height: 2px; border-radius: 1px; background: var(--rule); transition: background calc(300ms * var(--S)); }
.beats button.seen i { background: var(--ink); }
.beats button[aria-selected="true"] { color: var(--ink); }
.beats button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.beat-card { display: grid; gap: 14px; min-height: 210px; align-content: start; cursor: pointer; }
.bar { opacity: 1; }
.bar.debt { background: transparent; box-shadow: inset 0 0 0 1.4px color-mix(in srgb, var(--ink) 70%, transparent); }
.worth { font-family: var(--serif); font-size: 40px; line-height: 1.1; }
.week { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 150px; align-items: end; }
.week div { height: 100%; display: grid; grid-template-rows: 1fr auto; justify-items: center; gap: 6px; font-size: 11px; color: var(--pencil); }
.week .col { align-self: end; display: block; width: 60%; max-width: 22px; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--ink) 70%, transparent); transform-origin: bottom; }
.week .col.hot { background: var(--red); }
.week hr { position: absolute; left: 0; right: 0; margin: 0; border: 0; border-top: 1.2px dashed var(--pencil); transform-origin: left; }

/* ---------- 落地后的首页 ---------- */
.home { padding: 60px 22px 0; gap: 10px; }
.home h3 { font-family: var(--serif); font-size: 30px; font-weight: 500; margin: 0; }
.home .sub { font-size: 13px; color: var(--pencil); }
.home .hrule { height: 1.3px; background: var(--ink); opacity: .6; margin: 6px 0 4px; }
.home .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 6px; color: var(--pencil); font-size: 14px; }
.home .empty b { font-family: var(--serif); font-weight: 500; color: var(--ink); font-size: 18px; }
.home .acct-row { display: flex; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--rule); font-family: var(--serif); font-size: 17px; }
.home .acct-row span { font-family: var(--sans); font-size: 13px; color: var(--pencil); }
.home .dock { padding-bottom: 30px; display: grid; gap: 10px; }
.mic { justify-self: center; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 23px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule), 0 6px 18px rgba(0,0,0,.08); font-size: 14px; }
.mic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.mic.hot { color: var(--red); }
.hint { justify-self: center; font-size: 13px; color: var(--pencil); opacity: 0; }

/* ---------- 控制台 ---------- */
.panel { flex: 1 1 320px; max-width: 420px; min-width: 0; display: grid; gap: 18px; padding-top: 10px; }
.panel h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0; }
.panel p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--pencil); }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pbtn { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; cursor: pointer; background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule); font-size: 13.5px; }
.pbtn[aria-pressed="true"] { background: var(--ink); color: var(--on-accent); }
.panel select { height: 34px; border-radius: 17px; border: 0; padding: 0 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule); font: inherit; font-size: 13.5px; color: var(--ink); }
.box { background: var(--panel); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.box h2 { font-size: 12px; letter-spacing: .08em; color: var(--pencil); margin: 0; font-weight: 600; }
#hcanvas { width: 100%; height: 96px; display: block; }
.hlabel { font-size: 14px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--pencil); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.steps button { all: unset; cursor: pointer; display: block; padding: 6px 10px; border-radius: 10px; font-size: 13px; }
.steps button[aria-current="step"] { background: var(--ink); color: var(--on-accent); }
.steps button:focus-visible { outline: 2px solid var(--red); }
.steps .n { font-variant-numeric: tabular-nums; opacity: .55; margin-right: 6px; }
#stepnote { font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">
    <div class="home" id="home" aria-hidden="true"></div>
    <div class="sheet" id="sheet">
      <div class="top">
        <svg id="rule" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
          <path id="rulePencil" d="M4 8 C60 5 110 10 160 7 C210 4 262 9 296 7" stroke="var(--rule)" stroke-width="1.6"></path>
          <path id="ruleInk" d="M4 8 C60 5 110 10 160 7 C210 4 262 9 296 7" stroke="var(--ink)" stroke-width="1.6"></path>
        </svg>
        <button class="skip" id="skip">跳过</button>
      </div>
      <ol class="history" id="history" aria-label="已回答"></ol>
      <div class="stage" id="stage" aria-live="polite"></div>
      <div class="foot" id="foot"></div>
    </div>
    <div class="bx" id="bean" aria-hidden="true"><div class="by"><div class="bs"><div class="core"></div></div></div></div>
  </div>

  <aside class="panel">
    <div style="display:grid;gap:6px">
      <h1>芽豆初次引导 · 动效原型</h1>
      <p>看节奏用。浏览器里感受不到震动，右下的触感轨道把每一下画出来：竖线是瞬时触感，高度是强度；红色带是持续触感。</p>
    </div>
    <div class="ctrls">
      <button class="pbtn" id="restart">从头播放</button>
      <button class="pbtn" id="replay">重播本步</button>
      <button class="pbtn" id="slow" aria-pressed="false">慢放 ×0.4</button>
      <label for="scenario" class="note" style="margin-left:4px">账号</label>
      <select id="scenario">
        <option value="none">没识别到登录态</option>
        <option value="auto">已识别芽豆有物登录态</option>
      </select>
    </div>
    <div class="box">
      <h2>触感轨道</h2>
      <canvas id="hcanvas"></canvas>
      <div class="hlabel" id="hlabel">—</div>
      <div class="legend"><span><i style="background:var(--ink)"></i>瞬时</span><span><i style="background:var(--red);opacity:.6"></i>持续</span><span>最近 6 秒</span></div>
    </div>
    <div class="box">
      <h2>这一步</h2>
      <div id="stepnote"></div>
    </div>
    <div class="box">
      <h2>跳到</h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </aside>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const phone = $('#phone'), sheet = $('#sheet'), stage = $('#stage'), foot = $('#foot'), hist = $('#history'), home = $('#home');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = 1;
const K = () => (RM ? 0.02 : S);
const sync = () => document.documentElement.style.setProperty('--S', K());
sync();

/* ---------- 时间与取消：换步后，旧序列里的等待永远不再返回 ---------- */
let runId = 0;
const freeze = (id, p) => p.then(v => (id === runId ? v : new Promise(() => {})));
const sleep = ms => freeze(runId, new Promise(r => setTimeout(r, ms * K())));
function A(node, kf, o = {}) {
  const a = node.animate(kf, { duration: (o.duration ?? 400) * K(), delay: (o.delay ?? 0) * K(), easing: o.easing ?? 'ease', fill: o.fill ?? 'both', iterations: o.iterations ?? 1, direction: o.direction ?? 'normal' });
  return freeze(runId, a.finished.catch(() => {}).then(() => a));
}
const SPRING = 'cubic-bezier(.3, 1.45, .45, 1)';

    beanSet(fromX, Math.max(bean.y, 80), .7);
  }
  await beanMove(m.x, m.y - 2, .7, { duration: 640, fall: true });
  hap('豆子落定', .8, .35);
  A(mic, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)', offset: .35 }, { transform: 'scale(.97)', offset: .7 }, { transform: 'scale(1)' }], { duration: 520, easing: 'ease-out' });
  mic.classList.add('hot');
  await beanMove(m.x, m.y - 2, 0.01, { duration: 260, easing: 'ease-in' });
  fadeIn($('#hint', home), 80);
  await sleep(1400);
  mic.classList.remove('hot');
}

/* ---------- 导航 ---------- */
const scenario = $('#scenario');
function goTo(i, opts = {}) {
  runId++;
  state.step = i;
  sheet.getAnimations().forEach(a => a.cancel()); sheet.style.clipPath = ''; sheet.style.transform = '';
  core.getAnimations().forEach(a => a.cancel());
  home.innerHTML = '';
  renderHistory(opts.fromNext);
  ruleProgress(i);
  stage.style.opacity = 1;
  $('#stepnote').textContent = STEPS[i].note;
  document.querySelectorAll('#steps button').forEach((b, k) => (k === i ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current')));
  STEPS[i].run(opts.skip);
}
async function next() {
  let n = state.step + 1;
  if (n === 8 && state.loggedIn) n = 9;
  const id = runId;
  await A(stage, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-14px)' }], { duration: 240, easing: 'ease-in' });
  if (id !== runId) return;
  stage.getAnimations().forEach(a => a.cancel());
  goTo(n, { fromNext: true });
}

$('#steps').innerHTML = STEPS.map((s, k) => `<li><button data-k="${k}"><span class="n">${k}</span>${s.name}</button></li>`).join('');
$('#steps').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goTo(+b.dataset.k); });
$('#skip').onclick = () => goTo(9, { skip: true });
$('#restart').onclick = () => { state = fresh(); beanSet(-60, -60, 1); goTo(0); };
$('#replay').onclick = () => goTo(state.step);
$('#slow').onclick = e => { S = S === 1 ? 2.5 : 1; e.currentTarget.setAttribute('aria-pressed', S !== 1); sync(); goTo(state.step); };
scenario.onchange = () => { if (state.step === 2) goTo(2); };
addEventListener('resize', () => { if (bean.parked) park(false); });

prep($('#ruleInk'));
const startUp = () => goTo(0);
document.fonts && document.fonts.ready ? document.fonts.ready.then(startUp) : startUp();
})();
</script>
